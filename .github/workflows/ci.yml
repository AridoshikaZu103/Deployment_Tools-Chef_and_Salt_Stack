name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python syntax and imports
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///./test.db'
          SECRET_KEY: 'ci-testing-secret-key-do-not-use-in-production'
          ENVIRONMENT: 'test'
        run: |
          python -m compileall backend/app
          PYTHONPATH=backend python -c "from app.main import app; print('[CI OK] FastAPI app initialized successfully')"

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend distribution bundle
        run: |
          cd frontend
          npm run build

  configuration-validation:
    name: Configurations & Spec Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for YAML/JSON checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML environment configurations
        run: |
          python -c "
          import yaml, glob, sys
          files = glob.glob('environments/*.yaml') + glob.glob('environments/*.yml')
          for f in files:
              with open(f, 'r') as fp:
                  yaml.safe_load(fp)
              print(f'[CI OK] Validated YAML: {f}')
          "

      - name: Validate vercel.json syntax
        run: |
          python -c "
          import json
          with open('vercel.json', 'r') as fp:
              cfg = json.load(fp)
          assert 'builds' in cfg and 'routes' in cfg, 'Missing builds/routes in vercel.json'
          print('[CI OK] vercel.json syntax validated')
          "

      - name: Validate DT SVG brand logos
        run: |
          python -c "
          import os, glob, xml.etree.ElementTree as ET

          required_logos = [
              'assets/logo/dt-logo.svg',
              'assets/logo/dt-logo-white.svg',
              'assets/logo/dt-mark.svg'
          ]
          for path in required_logos:
              assert os.path.exists(path), f'Missing required SVG logo: {path}'
              with open(path, 'r', encoding='utf-8') as fp:
                  content = fp.read()
              root = ET.fromstring(content)
              assert root.tag.endswith('svg'), f'{path} root is not svg'
              assert 'viewBox' in root.attrib, f'{path} missing viewBox'
              assert 'data:image' not in content, f'{path} contains embedded raster images'
              assert '<image' not in content, f'{path} contains external image elements'
              assert 'AIza' not in content, f'{path} contains secrets'
              assert 'http://' not in content.replace('http://www.w3.org/2000/svg', ''), f'{path} contains unexpected remote URLs'
              print(f'[CI OK] Validated SVG logo: {path}')
          "

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [backend-validation, configuration-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nova-orchestrator:test

      - name: Build Vercel container Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vercel
          push: false
          tags: nova-orchestrator-vercel:test
